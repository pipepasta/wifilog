name: Release

# Push a `v*` tag to build, test and publish a release.
# Run it manually with an existing tag to rebuild that release's assets (they are replaced).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and upload assets for (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon runner; wifilog is macOS-only and tested on Apple Silicon
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      ARCHIVE: wifilog-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # Installs the Rust toolchain pinned in mise.toml (lefthook is not needed here)
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust

      - name: Check that the tag matches the version in Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version v$version"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir stage
          cp target/release/wifilog LICENSE README.md stage/
          tar -czf "$ARCHIVE" -C stage wifilog LICENSE README.md
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
              --verify-tag --title "$TAG" --generate-notes
          fi
