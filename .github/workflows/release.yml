name: Release

# Push a `v*` tag to build, test and publish a release.
# Releases are immutable: once a version is published its assets are never replaced, because
# users (and tools such as mise) pin their checksums. To ship a fix, release a new version.
# Run it manually only to retry a tag whose release was never created (e.g. the first run failed).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Pushed tag that has no release yet (e.g. v0.2.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon runner; wifilog is macOS-only and tested on Apple Silicon
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      ARCHIVE: wifilog-aarch64-apple-darwin.tar.gz
    steps:
      - name: Refuse to touch an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::release $TAG already exists; releases are immutable, publish a new version instead"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # Installs the Rust toolchain pinned in mise.toml (lefthook is not needed here)
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust

      - name: Check that the tag matches the version in Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version v$version"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir stage
          cp target/release/wifilog LICENSE README.md stage/
          tar -czf "$ARCHIVE" -C stage wifilog LICENSE README.md
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # Create a draft with the assets attached, then publish it. With immutable releases enabled,
        # nothing can be attached once a release is published.
        run: |
          gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
            --draft --verify-tag --title "$TAG" --generate-notes
          gh release edit "$TAG" --draft=false
